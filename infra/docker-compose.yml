# Локальная инфраструктура Martian Map.
# Запуск: docker compose -f infra/docker-compose.yml up -d
# Только db/redis/minio: docker compose -f infra/docker-compose.yml up -d db redis minio

name: martian-map

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: martian
      POSTGRES_PASSWORD: martian
      POSTGRES_DB: martian_map
    ports:
      # 5433 на хосте, чтобы не конфликтовать с локально установленным PostgreSQL
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U martian -d martian_map"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: martian
      MINIO_ROOT_PASSWORD: martian-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ../backend
    environment:
      MARTIAN_DATABASE_URL: postgresql+asyncpg://martian:martian@db:5432/martian_map
      MARTIAN_REDIS_URL: redis://redis:6379/0
      MARTIAN_OBJECT_STORE_ENDPOINT: http://minio:9000
    ports:
      # 8080 на хосте: 8000 часто занят другим локальным сервисом
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ../frontend
    environment:
      API_HOST: api:8000
    ports:
      # Полный стек локально: http://localhost:8081
      - "8081:80"
    depends_on:
      - api

  worker:
    build: ../backend
    command: celery -A martian_map.worker.celery_app worker --loglevel=info
    environment:
      MARTIAN_DATABASE_URL: postgresql+asyncpg://martian:martian@db:5432/martian_map
      MARTIAN_REDIS_URL: redis://redis:6379/0
      MARTIAN_OBJECT_STORE_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db-data:
  minio-data:
