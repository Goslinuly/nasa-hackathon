name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest

  backend-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: martian
          POSTGRES_PASSWORD: martian
          POSTGRES_DB: martian_map
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U martian -d martian_map"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MARTIAN_DATABASE_URL: postgresql+asyncpg://martian:martian@localhost:5432/martian_map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Migrations on clean database
        run: alembic upgrade head
      - name: Seed product registry
        run: python scripts/seed_registry.py
      - name: Seed is idempotent
        run: python scripts/seed_registry.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
