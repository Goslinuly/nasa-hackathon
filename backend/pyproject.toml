[project]
name = "martian-map-backend"
version = "0.1.0"
description = "Martian Map: API каталога, покрытия и маршрутов (FastAPI + PostgreSQL/PostGIS)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    # Приватная сеть Railway — IPv6, healthcheck и публичный домен — IPv4.
    # uvicorn не умеет слушать оба стека: asyncio жёстко ставит IPV6_V6ONLY,
    # поэтому "::" отрезает IPv4, а "0.0.0.0" — IPv6. gunicorn создаёт сокет
    # сам и V6ONLY не трогает, так что [::] принимает оба.
    "gunicorn>=23",
    "uvicorn-worker>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/martian_map"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends()/Query() в аргументах по умолчанию — идиома FastAPI
ignore = ["B008"]
